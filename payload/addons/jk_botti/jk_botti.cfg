# jk_botti configuration for StargateTC
# Lines starting with # are comments. This file runs at every map start.
#
# Each "addbot" adds a bot:  addbot "" "" <skill>   (skill 1 = best, 5 = worst)
# Bots pick the smaller team and a class, and get one of that class's packs at
# every spawn (see info/pack*_<class>.txt).
#
# Debug commands (server console, prefix with "jk_botti "): sgtc_dump, sgtc_trace 1, bot_trace 1
pause 3
autowaypoint 1
bot_add_level_tag 0
bot_conntimes 0
team_balancetype 0
bot_chat_percent 10
bot_taunt_percent 20
bot_whine_percent 10
bot_endgame_percent 40
bot_chat_tag_percent 80
bot_chat_drop_percent 10
bot_chat_swap_percent 10
bot_chat_lower_percent 50
bot_logo_percent 40
random_color 1
bot_shoot_breakables 2
bot_join_after_player 0
botskill 3
addbot "" "" 2
addbot "" "" 3
addbot "" "" 3
addbot "" "" 4
addbot "" "" 2
addbot "" "" 3
addbot "" "" 3
addbot "" "" 2
